<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 60px auto 0 auto;
            background: rgba(40,40,40,0.95);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 40px 30px 30px 30px;
            color: #fff;
            animation: fadeInUp 0.8s cubic-bezier(.39,.575,.565,1.000);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: normal;
        }
        .auth-container form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .auth-container input[type="text"],
        .auth-container input[type="password"] {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1em;
            transition: box-shadow 0.3s;
        }
        .auth-container input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #007bff;
        }
        .auth-container button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,123,255,0.2);
        }
        .auth-container button:hover {
            background: linear-gradient(90deg, #0056b3, #003f8f);
            transform: translateY(-2px);
        }
        .switch-link {
            color: #aaa;
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.95em;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.95em;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">灵壳壁纸分享</a>
        <nav>
            <a href="index.html">首页</a>
            <a href="upload.html">上传壁纸</a>
        </nav>
    </header>
    <div class="auth-container" id="auth-container">
        <h2 id="form-title">登录</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="用户名" required autocomplete="username">
            <input type="password" id="login-password" placeholder="密码" required autocomplete="current-password">
            <button type="submit">登录</button>
            <div class="error-message" id="login-error"></div>
        </form>
        <form id="register-form" style="display:none;">
            <input type="text" id="register-username" placeholder="用户名" required autocomplete="username">
            <input type="password" id="register-password" placeholder="密码" required autocomplete="new-password">
            <button type="submit">注册</button>
            <div class="error-message" id="register-error"></div>
        </form>
        <div class="switch-link" id="switch-link">没有账号？注册</div>
    </div>
    <footer>
        <p>&copy; 2025 灵壳壁纸分享</p>
    </footer>
    <script src="./js/login.js"></script>
</body>
</html>
