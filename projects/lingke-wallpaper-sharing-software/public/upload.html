<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传壁纸</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .upload-container {
            max-width: 500px;
            margin: 60px auto 0 auto;
            background: rgba(40,40,40,0.97);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 40px 30px 30px 30px;
            color: #fff;
            animation: fadeInUp 0.8s cubic-bezier(.39,.575,.565,1.000);
        }
        .upload-container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: normal;
        }
        .upload-container form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .upload-container input[type="file"],
        .upload-container select {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1em;
        }
        .upload-container input[type="file"] {
            background: none;
        }
        .upload-container button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,123,255,0.2);
        }
        .upload-container button:hover {
            background: linear-gradient(90deg, #0056b3, #003f8f);
            transform: translateY(-2px);
        }
        .upload-container label {
            margin-bottom: 4px;
            color: #bbb;
            font-size: 0.98em;
        }
        .success-message {
            color: #4caf50;
            text-align: center;
            font-size: 0.98em;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.98em;
        }
        .preview-img {
            display: block;
            margin: 0 auto 10px auto;
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: fadeInUp 0.5s;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">灵壳壁纸分享</a>
        <nav>
            <a href="index.html">首页</a>
            <a href="upload.html">上传壁纸</a>
            <a href="login.html">登录/注册</a>
        </nav>
    </header>
    <div class="upload-container">
        <h2>上传壁纸</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <label for="image">选择图片</label>
            <input type="file" id="image" name="image" accept="image/*" required>
            <img id="preview" class="preview-img" style="display:none;" alt="预览">
            <label for="resolution">分辨率</label>
            <select id="resolution" name="resolution" required>
                <option value="">请选择分辨率</option>
                <option value="4K">4K</option>
                <option value="2K">2K</option>
                <option value="1080P">1080P</option>
            </select>
            <label for="categories">分类</label>
            <select id="categories" name="categories" multiple required style="height: 80px;"></select>
            <button type="submit">上传</button>
            <div class="success-message" id="success-message"></div>
            <div class="error-message" id="error-message"></div>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 灵壳壁纸分享</p>
    </footer>
    <script src="./js/upload.js"></script>
</body>
</html>
