<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壁纸详情</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .detail-container {
            max-width: 900px;
            margin: 60px auto 0 auto;
            background: rgba(40,40,40,0.97);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 40px 30px 30px 30px;
            color: #fff;
            animation: fadeInUp 0.8s cubic-bezier(.39,.575,.565,1.000);
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
        }
        .detail-img {
            flex: 1 1 350px;
            min-width: 320px;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detail-img img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(.39,.575,.565,1.000);
        }
        .detail-img img:hover {
            transform: scale(1.04) rotate(-1deg);
        }
        .detail-info {
            flex: 1 1 250px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }
        .detail-info h2 {
            margin: 0 0 10px 0;
            font-weight: normal;
            font-size: 1.5em;
        }
        .detail-info .meta {
            color: #bbb;
            font-size: 1em;
        }
        .detail-info .categories {
            margin: 8px 0;
        }
        .detail-info .category-tag {
            display: inline-block;
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: #fff;
            border-radius: 12px;
            padding: 3px 14px;
            margin-right: 8px;
            font-size: 0.95em;
            margin-bottom: 4px;
            box-shadow: 0 2px 6px rgba(0,123,255,0.15);
            animation: fadeInUp 0.5s;
        }
        .detail-info .download-btn {
            margin-top: 18px;
            padding: 12px 30px;
            background: linear-gradient(90deg, #007bff, #0056b3);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,123,255,0.2);
        }
        .detail-info .download-btn:hover {
            background: linear-gradient(90deg, #0056b3, #003f8f);
            transform: translateY(-2px);
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            font-size: 1em;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 700px) {
            .detail-container {
                flex-direction: column;
                padding: 20px 8px;
            }
            .detail-img, .detail-info {
                min-width: 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">灵壳壁纸分享</a>
        <nav>
            <a href="index.html">首页</a>
            <a href="upload.html">上传壁纸</a>
            <a href="login.html">登录/注册</a>
        </nav>
    </header>
    <div class="detail-container" id="detail-container">
        <!-- 详情内容通过JS加载 -->
    </div>
    <footer>
        <p>&copy; 2025 灵壳壁纸分享</p>
    </footer>
    <script src="./js/wallpaper-detail.js"></script>
</body>
</html>
